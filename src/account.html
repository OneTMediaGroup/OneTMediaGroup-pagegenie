<style>dialog{width:min(580px,95vw);border:1px solid var(--line);border-radius:20px;padding:28px;color:var(--ink);max-height:90vh;overflow:auto}dialog::backdrop{background:#142b5066;backdrop-filter:blur(4px)}#projectList{font-size:13px;color:var(--muted)}@media(max-width:500px){header .badge{display:none}}</style>
<dialog id="accountDialog" aria-labelledby="accountHeading"><div class="toolbar"><h2 id="accountHeading">Your PageGenie projects</h2><button class="ghost" id="accountClose" aria-label="Close account dialog">✕</button></div><p id="accountMessage" role="status">Sign in to save your projects.</p><div id="signedOutControls"><form id="accountForm"><label class="label" for="accountEmail">Email address</label><input id="accountEmail" type="email" required autocomplete="email"><label class="label" for="accountPassword">Password</label><input id="accountPassword" type="password" required minlength="8" autocomplete="current-password"><div class="actions"><button type="submit">Sign in</button><button type="button" class="secondary" id="createAccount">Create account</button></div></form><button class="ghost" style="margin-top:16px" id="resetPassword">Forgot password?</button><p class="small">Business details and drafts stay private until you publish a shareable preview.</p></div><div class="hidden" id="signedInControls"><p id="accountIdentity" class="small"></p><div class="row"><button class="secondary" id="verifyEmail">Send verification email / check status</button><button class="ghost" id="signOut">Sign out</button></div><div class="actions"><h3>Saved websites</h3><button class="secondary" onclick="newCloudProject()">＋ New website</button></div><div id="projectList"></div><button class="ghost" style="margin-top:20px" onclick="unpublishCloud()">Unpublish current preview</button></div></dialog>
